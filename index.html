<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Personal AI Core</title><style>body{margin:0;background:#101827;color:#f2f6ff;font:16px system-ui}main{max-width:680px;margin:auto;padding:24px 18px 100px}h1{font-size:24px}.sub{color:#a9bad4}#chat{min-height:48vh}article{padding:13px 15px;border-radius:14px;background:#233249;margin:12px 0;white-space:pre-wrap}article.me{background:#174d6b;margin-left:15%}form{display:flex;gap:8px;position:fixed;bottom:0;left:0;right:0;padding:12px;background:#101827}input{flex:1;min-width:0;border:1px solid #41516a;border-radius:12px;padding:13px;background:#1c293b;color:white;font-size:16px}button{background:#67b9ff;color:#071522;border:0;border-radius:12px;padding:12px;font-weight:bold}small{color:#b4c6df}</style></head><body><main><h1>🧠 Personal AI Core <small>v0.0.1</small></h1><p class="sub">ゼロから作った小さな学習AI · オフライン対応</p><p id="status">学習準備中…</p><section id="chat" aria-live="polite"></section><button id="reset" type="button">学習を初期化</button></main><form id="form"><input id="message" placeholder="日本語で話しかける…" autocomplete="off"><button>送信</button></form><script>
// A tiny, fully handwritten neural classifier. No pretrained weights or AI API.
const samples=[['こんにちは','greet'],['やあ','greet'],['おはよう','greet'],['こんばんは','greet'],['ありがとう','thanks'],['助かった','thanks'],['感謝','thanks'],['名前は','name'],['君の名前','name'],['誰なの','name'],['元気','mood'],['調子は','mood'],['大丈夫','mood'],['さようなら','bye'],['またね','bye'],['バイバイ','bye']];
const labels=['greet','thanks','name','mood','bye'];const replies={greet:'こんにちは！僕はゼロから学習した小さなAIだよ。',thanks:'どういたしまして！',name:'僕はPersonal AI Core。まだ学習を始めたばかりだよ。',mood:'元気だよ！もっと言葉を学びたいな。',bye:'またね！'};
const chars=[...new Set(samples.flatMap(([s])=>[...s]))];const D=chars.length,H=12,K=labels.length;let W1,b1,W2,b2;
const rand=()=> (Math.random()-.5)*.3;function init(){W1=Array.from({length:H},()=>Array.from({length:D},rand));b1=Array(H).fill(0);W2=Array.from({length:K},()=>Array.from({length:H},rand));b2=Array(K).fill(0)}
function vec(s){let x=Array(D).fill(0);for(const c of s){const i=chars.indexOf(c);if(i>=0)x[i]=1}return x}
function forward(x){const h=W1.map((w,j)=>Math.tanh(w.reduce((a,v,i)=>a+v*x[i],b1[j])));const z=W2.map((w,k)=>w.reduce((a,v,j)=>a+v*h[j],b2[k]));const m=Math.max(...z),e=z.map(v=>Math.exp(v-m)),sum=e.reduce((a,b)=>a+b,0);return {h,p:e.map(v=>v/sum)}}
function train(){init();const rate=.07;for(let epoch=0;epoch<450;epoch++){for(const [s,label] of samples){const x=vec(s),{h,p}=forward(x),y=labels.indexOf(label),dz=p.map((v,k)=>v-(k===y?1:0));const dh=h.map((v,j)=>(1-v*v)*dz.reduce((a,g,k)=>a+g*W2[k][j],0));for(let k=0;k<K;k++){for(let j=0;j<H;j++)W2[k][j]-=rate*dz[k]*h[j];b2[k]-=rate*dz[k]}for(let j=0;j<H;j++){for(let i=0;i<D;i++)W1[j][i]-=rate*dh[j]*x[i];b1[j]-=rate*dh[j]}}}save()}
function save(){localStorage.setItem('personal-ai-weights',JSON.stringify({W1,b1,W2,b2}))}function load(){try{const v=JSON.parse(localStorage.getItem('personal-ai-weights'));if(!v)return false;({W1,b1,W2,b2}=v);return W1.length===H&&W1[0].length===D}catch{return false}}
const chat=document.querySelector('#chat');function add(s,me=false){const a=document.createElement('article');a.className=me?'me':'';a.textContent=s;chat.append(a);a.scrollIntoView({block:'end'})}
function answer(s){const x=vec(s);if(!x.some(Boolean))return 'まだその言葉は分からないよ。今は挨拶・名前・お礼などを学習しているところ。';const {p}=forward(x),best=p.indexOf(Math.max(...p));return Math.max(...p)<.48?'まだ自信がないよ。別の言い方で試してみて。':replies[labels[best]]}
function boot(){const existing=load();if(!existing)train();document.querySelector('#status').textContent=existing?'保存した学習結果を読み込みました':'初期データからニューラルネットワークを学習しました';add('こんにちは！「おはよう」「名前は？」「ありがとう」などと話しかけてね。※このAIは簡単な意図分類モデルです。')};document.querySelector('#form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#message'),s=input.value.trim();if(!s)return;add(s,true);add(answer(s));input.value=''};document.querySelector('#reset').onclick=()=>{if(confirm('学習結果を削除して再学習しますか？')){localStorage.removeItem('personal-ai-weights');train();add('初期データから再学習しました。')}};boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
